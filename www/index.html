<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Stop pinch-zoom and double-tap zoom on phones.
       viewport-fit=cover lets us draw behind the notch; we then use the
       safe-area values to keep important things out of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tank Rush: Base Defense</title>
  <meta name="description" content="Drive your tank, stop the enemy waves and protect your base.">

  <meta name="theme-color" content="#1c211a">
  <meta name="format-detection" content="telephone=no">

  <style>
    /* Fill the whole screen, no margins, no scrolling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;  /* older browsers without dvw / dvh (Safari before 15.4) */
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;          /* nothing to scroll, so no rubber-band bounce */
      overscroll-behavior: none; /* no pull-to-refresh or overscroll glow */
      background: #1c211a; /* the metal around the playfield in the first theme; themes.js updates it */

      /* No text selection, no long-press menu, no tap highlight */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;

      /* Tell the browser not to scroll or zoom on touches */
      touch-action: none;
    }

    /* One canvas covering the whole screen. Everything (map, tank,
       joystick, fire button) is drawn on it by the game scripts */
    #game {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;  /* fallback, as above */
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: block;
      touch-action: none;
    }

    /* Invisible helper: its padding equals the phone's safe areas
       (notch or camera hole, status bar, rounded corners, gesture bar).
       layout.js reads these numbers and keeps the playfield, HUD and
       controls out of them. */
    #safe-area {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe-area"></div>

  <!-- The game code: settings and data first, then the game
       (game.js, with init(), is last). Everything is
       local: no file is loaded from the internet. -->
  <script src="config.js"></script>
  <script src="themes.js"></script>
  <script src="materials.js"></script>
  <script src="ui.js"></script>
  <script src="enemies.js"></script>
  <script src="levels.js"></script>
  <script src="levelgen.js"></script>
  <script src="powerups.js"></script>
  <script src="shop.js"></script>
  <script src="pause.js"></script>
  <script src="tutorial.js"></script>
  <script src="save.js"></script>
  <script src="title.js"></script>
  <script src="audio.js"></script>
  <script src="music.js"></script>
  <script src="ads.js"></script>
  <script src="layout.js"></script>
  <script src="map.js"></script>
  <script src="state.js"></script>
  <script src="input.js"></script>
  <script src="tanks.js"></script>
  <script src="enemyai.js"></script>
  <script src="pickups.js"></script>
  <script src="bullets.js"></script>
  <script src="explosions.js"></script>
  <script src="feedback.js"></script>
  <script src="render.js"></script>
  <script src="hud.js"></script>
  <script src="screens.js"></script>
  <script src="gameover.js"></script>
  <script src="controls.js"></script>
  <script src="debug.js"></script>
  <script src="game.js"></script>
</body>
</html>
